<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>404 - Page Not Found | Skyhit Media</title>
    <meta name="description" content="The Skyhit Media page you requested could not be found.">
    <style>
      :root {
        --primary: #5f6b70;
        --secondary: #be7f51;
        --ink: #273136;
        --soft: #fff6f3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--soft);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(100%, 520px);
        text-align: center;
        background: #fff;
        border-top: 8px solid var(--secondary);
        padding: 40px 28px;
        box-shadow: 0 18px 50px rgba(39, 49, 54, 0.12);
      }

      img {
        width: 172px;
        height: auto;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(56px, 13vw, 92px);
        line-height: 1;
        color: var(--primary);
      }

      h2 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0 auto 28px;
        max-width: 36ch;
        color: #5f6b70;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        background: var(--secondary);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/header-skyhit-logo-desktop.webp" alt="Skyhit Media">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you are looking for does not exist or has moved. Start again from the Skyhit Media homepage.</p>
      <a href="/">Go Back Home</a>
    </main>
  </body>
</html>
